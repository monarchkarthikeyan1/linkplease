services:
  - type: web
    name: linkplease
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: VERIFY_WEBHOOK_SIGNATURE
        value: "true"
      - key: DB_PATH
        value: /opt/render/project/src/linkplease.db
